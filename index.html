      <div style={{ borderTop: "1px solid #1a2840", paddingTop: 9, marginTop: 2, fontSize: 9.5, color: "#3a5070", lineHeight: 1.6 }}>
        <strong style={{ color: "#4a6080" }}>Navigate:</strong><br />
        Drag to pan<br />Scroll to zoom<br />Click node for details
      </div>

      <div style={{ borderTop: "1px solid #1a2840", paddingTop: 9, marginTop: 2 }}>
        <div style={{ fontSize: 9.5, letterSpacing: "0.12em", color: "#3a5070", textTransform: "uppercase", marginBottom: 7 }}>Network Stats</div>
        {[
          ["Total network papers", PAPERS.filter(p => p.tier !== "bio-ignored").length],
          ["Use ESA aggregate", PAPERS.filter(p => p.usesESA).length],
          ["Engage bio lit.", PAPERS.filter(p => p.engagesBio && p.tier !== "bio-ignored").length],
          ["Bio papers ignored", PAPERS.filter(p => p.tier === "bio-ignored").length],
          ["Mapped edges", EDGES.length],
        ].map(([l,v]) => (
          <div key={l} style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
            <span style={{ fontSize: 9.5, color: "#4a6080" }}>{l}</span>
            <span style={{ fontSize: 9.5, color: "#8ab4d8", fontWeight: "bold" }}>{v}</span>
          </div>
        ))}
      </div>
    </div>

    {/* SVG canvas */}
    <div style={{ flex: 1, position: "relative", overflow: "hidden", cursor: dragging ? "grabbing" : "grab" }}>
      <svg ref={svgRef} width="100%" height="100%"
        onMouseDown={handleMouseDown}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
        style={{ display: "block" }}
      >
        <defs>
          <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
            <path d="M0,0 L0,6 L7,3 z" fill="#e8652a" />
          </marker>
          <filter id="glow-r" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-g" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
          {/* Bio zone */}
          <rect x="1018" y="55" width="204" height="580" rx="8"
            fill="#0a1a0e" stroke="#2a6040" strokeWidth="1.5" strokeDasharray="7,4" />
          <text x="1120" y="45" textAnchor="middle" fontSize="9" fill="#3a8055" letterSpacing="1.5">BIOLOGICAL / NEUROSCIENCE /</text>
          <text x="1120" y="57" textAnchor="middle" fontSize="9" fill="#3a8055" letterSpacing="1.5">SPORTS SCIENCE LITERATURE</text>
          <text x="1120" y="650" textAnchor="middle" fontSize="9" fill="#c0392b" fontStyle="italic">→ zero citations from network</text>

          {/* Edges */}
          {visibleEdges.map((edge, i) => {
            const from = PAPERS.find(p => p.id === edge.from);
            const to   = PAPERS.find(p => p.id === edge.to);
            if (!from || !to) return null;
            const isLit = selected && (edge.from === selected || edge.to === selected);
            const isHov = hovered && (edge.from === hovered || edge.to === hovered);
            const dx = to.x - from.x, dy = to.y - from.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const toR = TIER_CONFIG[to.tier]?.size || 28;
            const nx = dx/dist, ny = dy/dist;
            return (
              <line key={i}
                x1={from.x + nx*(TIER_CONFIG[from.tier]?.size||28)+2}
                y1={from.y + ny*(TIER_CONFIG[from.tier]?.size||28)+2}
                x2={to.x   - nx*(toR+5)}
                y2={to.y   - ny*(toR+5)}
                stroke={isLit || isHov ? "#ff7755" : "#e8652a"}
                strokeWidth={isLit || isHov ? 2.2 : 1.1}
                opacity={selected && !isLit ? 0.12 : isLit || isHov ? 1 : 0.75}
                markerEnd="url(#arr)"
                style={{ transition: "opacity 0.15s" }}
              />
            );
          })}

          {/* Nodes */}
          {visiblePapers.map(paper => {
            const cfg = TIER_CONFIG[paper.tier] || TIER_CONFIG.secondary;
            const r = cfg.size;
            const isSel = selected === paper.id;
            const isHov = hovered === paper.id;
            const lines = paper.label.split("\n");
            return (
              <g key={paper.id}
                transform={`translate(${paper.x},${paper.y})`}
                onClick={e => { e.stopPropagation(); setSelected(selected===paper.id ? null : paper.id); }}
                onMouseEnter={() => setHovered(paper.id)}
                onMouseLeave={() => setHovered(null)}
                style={{ cursor: "pointer" }}
              >
                {(isSel || isHov) && <circle r={r+9} fill="none" stroke={cfg.border} strokeWidth="1.5" opacity="0.35" />}
                <circle r={r}
                  fill={isSel ? cfg.border : cfg.color}
                  stroke={cfg.border}
                  strokeWidth={isSel ? 3 : 2}
                  filter={paper.tier==="hub" ? "url(#glow-r)" : paper.tier==="bio-ignored" ? "url(#glow-g)" : "none"}
                  opacity={selected && !isSel ? 0.5 : 1}
                />
                {paper.usesESA && <circle r={5} cx={r-5} cy={-(r-5)} fill="#c4a23a" stroke="#070d1a" strokeWidth="1.2" />}
                {paper.engagesBio && paper.tier !== "bio-ignored" && <circle r={5} cx={-(r-5)} cy={-(r-5)} fill="#3a8c5a" stroke="#070d1a" strokeWidth="1.2" />}
                {lines.map((line, li) => (
                  <text key={li}
                    y={li * 11 - (lines.length-1) * 5.5}
                    textAnchor="middle"
                    fontSize={paper.tier==="hub" ? 11 : 9}
                    fontWeight={paper.tier==="hub" ? "bold" : "normal"}
                    fill={paper.tier==="hub" ? "#fff" : "#c8d8f0"}
                    style={{ pointerEvents:"none", userSelect:"none" }}
                  >{line}</text>
                ))}
              </g>
            );
          })}
        </g>
      </svg>

      {/* Detail panel */}
      {activePaper && (() => {
        const p = activePaper;
        const cfg = TIER_CONFIG[p.tier];
        const inE  = EDGES.filter(e => e.to   === p.id && visibleIds.has(e.from));
        const outE = EDGES.filter(e => e.from === p.id && visibleIds.has(e.to));
        return (
          <div style={{
            position: "absolute", bottom: 16, right: 16, width: 318,
            background: "#070e1c", border: `1px solid ${cfg.border}55`,
            borderRadius: 8, padding: "13px 15px", fontSize: 11, lineHeight: 1.6,
            boxShadow: "0 6px 28px #00000099", maxHeight: "58vh", overflowY: "auto",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 7 }}>
              <div>
                <div style={{ fontSize: 13, color: cfg.border, fontWeight: "bold", marginBottom: 1 }}>{p.label.replace(/\n/g," ")}</div>
                <div style={{ fontSize: 9.5, color: "#4a6080", fontStyle: "italic" }}>{p.journal}</div>
              </div>
              {selectedPaper && (
                <button onClick={() => setSelected(null)} style={{ background:"none", border:"none", color:"#4a6080", cursor:"pointer", fontSize:18, lineHeight:1, padding:"0 2px" }}>×</button>
              )}
            </div>
            <div style={{ color: "#7a90a8", marginBottom: 9, fontSize: 10, fontStyle: "italic", lineHeight: 1.5 }}>{p.fullTitle}</div>
            <div style={{ color: "#7a9cb8", marginBottom: 9, fontSize: 10.5, lineHeight: 1.6 }}>{p.note}</div>
            <div style={{ display: "flex", gap: 14, borderTop: "1px solid #1a2840", paddingTop: 8, flexWrap: "wrap" }}>
              {[["Citations", p.citations.toLocaleString(), cfg.border],
                ["Cites (net)", outE.length, "#8ab4d8"],
                ["Cited by", inE.length, "#8ab4d8"],
              ].map(([l,v,c]) => (
                <div key={l}>
                  <div style={{ fontSize: 8.5, color: "#3a5070", textTransform: "uppercase", letterSpacing: "0.1em" }}>{l}</div>
                  <div style={{ color: c, fontWeight: "bold", fontSize: 13 }}>{v}</div>
                </div>
              ))}
              {p.usesESA && <div><div style={{ fontSize: 8.5, color: "#c4a23a", textTransform: "uppercase", letterSpacing: "0.1em" }}>ESA Flag</div><div style={{ color: "#c4a23a", fontWeight:"bold", fontSize:13 }}>✓</div></div>}
            </div>
            {p.engagesBioNote && (
              <div style={{ marginTop: 8, padding: "6px 9px", background: "#0a1e10", borderLeft: "2px solid #3a8c5a", fontSize: 10, color: "#5a9070", lineHeight: 1.5 }}>
                {p.engagesBioNote}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  </div>

  {/* Footer */}
  <div style={{ padding: "7px 24px", borderTop: "1px solid #1a2840", fontSize: 8.5, color: "#2a4060", fontStyle: "italic", background: "#060c17", display: "flex", justifyContent: "space-between", flexShrink: 0 }}>
    <span>This network does not represent independent research programs converging on the same conclusions. It is a self-referential citation loop.</span>
    <span>Not a single paper in the cultural network cites the biological or sports science literature.</span>
  </div>
</div>
```

);
}

ReactDOM.createRoot(document.getElementById(“root”)).render(<CitationNetwork />);
</script>

</body>
</html>
